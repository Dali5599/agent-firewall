<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="themeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.4"/>
    </pattern>
    <filter id="glowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bgGrad)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>

  <!-- Ambient Glowing Orbs -->
  <circle cx="1080" cy="180" r="240" fill="#a855f7" opacity="0.14" filter="url(#glowLight)"/>
  <circle cx="220" cy="500" r="280" fill="#f43f5e" opacity="0.10" filter="url(#glowLight)"/>

  <!-- Brand Pill Header -->
  <g transform="translate(120, 110)">
    <rect width="210" height="34" rx="17" fill="#1e293b" stroke="#581c87" stroke-width="1.5"/>
    <circle cx="20" cy="17" r="5" fill="#f472b6"/>
    <text x="36" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#e2e8f0" letter-spacing="1">OPEN SOURCE • 2026</text>
  </g>

  <!-- Main Title -->
  <text x="120" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-weight="900" font-size="64" fill="url(#themeGrad)" letter-spacing="-1">AGENT FIREWALL</text>

  <!-- Description / Subtitle -->
  <text x="120" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="22" fill="#94a3b8">
    <tspan x="120" dy="0">Enterprise-grade real-time security proxy, bash guard, and PII redacto</tspan>
    <tspan x="120" dy="32">r for autonomous AI coding agents</tspan>
  </text>

  <!-- Feature Badges -->
  
        <g transform="translate(120, 460)">
          <rect width="130" height="38" rx="10" fill="#2e1065" stroke="#581c87" stroke-width="1.5"/>
          <text x="65" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#f472b6" text-anchor="middle">AI AGENT</text>
        </g>
        
        <g transform="translate(265, 460)">
          <rect width="130" height="38" rx="10" fill="#2e1065" stroke="#581c87" stroke-width="1.5"/>
          <text x="65" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#f472b6" text-anchor="middle">SECURITY</text>
        </g>
        
        <g transform="translate(410, 460)">
          <rect width="130" height="38" rx="10" fill="#2e1065" stroke="#581c87" stroke-width="1.5"/>
          <text x="65" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#f472b6" text-anchor="middle">FIREWALL</text>
        </g>
        
        <g transform="translate(555, 460)">
          <rect width="130" height="38" rx="10" fill="#2e1065" stroke="#581c87" stroke-width="1.5"/>
          <text x="65" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#f472b6" text-anchor="middle">CYBERSECURITY</text>
        </g>
        

  <!-- Logo Mark on Right Side -->
  <g transform="translate(900, 200)">
    <rect width="240" height="240" rx="60" fill="#0f172a" stroke="#581c87" stroke-width="3"/>
    <rect width="240" height="240" rx="60" fill="none" stroke="url(#themeGrad)" stroke-width="2" opacity="0.7"/>
    <g transform="translate(56, 56) scale(5.3)">
      
        <path d="M12 2a10 10 0 0 0-10 10c0 4.42 2.87 8.17 6.84 9.5.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34-.46-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.87 1.52 2.34 1.07 2.91.83.1-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.92 0-1.11.38-2 1.03-2.71-.1-.25-.45-1.29.1-2.64 0 0 .84-.27 2.75 1.02.79-.22 1.65-.33 2.5-.33.85 0 1.71.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.35.2 2.39.1 2.64.65.71 1.03 1.6 1.03 2.71 0 3.82-2.34 4.66-4.57 4.91.36.31.69.92.69 1.85V21c0 .27.16.59.67.5C19.14 20.16 22 16.42 22 12A10 10 0 0 0 12 2z" fill="url(#themeGrad)"/>
        
    </g>
  </g>

  <!-- Footer Watermark -->
  <g transform="translate(120, 565)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#64748b">
      Autonomously engineered with precision by <tspan font-weight="700" fill="#94a3b8">Requin AI Agent</tspan> • GitHub: <tspan fill="#f472b6">Dali5599</tspan>
    </text>
  </g>
</svg>